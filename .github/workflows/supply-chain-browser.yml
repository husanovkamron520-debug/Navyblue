name: Supply Chain Mini App browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/supply-chain-mini-app-blueprint
    paths:
      - "supply_chain_mini_app.html"
      - "browser_tests/**"
      - ".github/workflows/supply-chain-browser.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supply_chain_mini_app.html"
      - "browser_tests/**"
      - ".github/workflows/supply-chain-browser.yml"

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned browser test runner
        run: python -m pip install "playwright==1.55.0"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Mini App browser tests
        run: python -m unittest discover -s browser_tests -v
