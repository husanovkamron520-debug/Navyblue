name: Python compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all runtime modules
        run: python -m py_compile bot.py ppt_story_engine.py ppt_visual_director.py ppt_asset_manifest.py ppt_content_critic.py ppt_visual_engine.py ppt_media_sources.py museum.py supply_chain.py
      - name: Install visual test dependencies
        run: python -m pip install "Pillow>=9"
      - name: Test media source licensing rules
        run: python -m unittest discover -s tests -v
