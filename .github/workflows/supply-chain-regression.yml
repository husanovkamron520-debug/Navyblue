name: Supply Chain regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - docs/supply-chain-mini-app-blueprint
  pull_request:
    branches:
      - main
    paths:
      - "supply_chain.py"
      - "supply_chain_api.py"
      - "bot.py"
      - "supply_chain_import.py"
      - "supply_chain_mini_app.html"
      - "browser_tests/**"
      - "tests/**"
      - ".github/workflows/supply-chain-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install module runtime dependency
        run: python -m pip install --upgrade pip && python -m pip install "python-telegram-bot==21.4" "Pillow>=10,<13"
      - name: Compile Supply Chain modules
        run: python -m py_compile bot.py supply_chain.py supply_chain_import.py supply_chain_api.py supply_chain_persistence.py tests/test_supply_chain_regression.py tests/test_supply_chain_api.py tests/test_supply_chain_persistence.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned browser test runner
        run: python -m pip install "playwright==1.55.0"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Mini App browser tests
        run: python -m unittest discover -s browser_tests -v
