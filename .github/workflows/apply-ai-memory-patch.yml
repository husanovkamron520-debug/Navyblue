name: Apply Supply Chain AI memory patch

on:
  push:
    paths:
      - "scripts/apply_ai_memory_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch (all-or-nothing)
        run: python scripts/apply_ai_memory_patch.py supply_chain.py
      - name: Syntax check
        run: python -m py_compile supply_chain.py
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supply_chain.py
          git commit -m "Add conversation memory to Supply Chain AI advisor"
          git push origin HEAD:main
