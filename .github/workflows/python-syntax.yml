name: Python syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supplychain14-miniapp-menu]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot entry points
        run: python -m py_compile bot.py supply_chain.py
