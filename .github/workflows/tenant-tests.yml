name: Tenant isolation primitives

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "supply_chain_mini_app.html"
      - "supply_chain_api.py"
      - "supply_chain_tenants.py"
      - "tests/test_tenant_sessions.py"
      - ".github/workflows/tenant-tests.yml"
  pull_request:
    paths:
      - "bot.py"
      - "supply_chain_mini_app.html"
      - "supply_chain_api.py"
      - "supply_chain_tenants.py"
      - "tests/test_tenant_sessions.py"
      - ".github/workflows/tenant-tests.yml"

jobs:
  tenant-session-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tenant session tests
        run: python -m unittest discover -s tests -p "test_tenant_sessions.py" -v
      - name: Check Mini App JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("supply_chain_mini_app.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\\s*(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("Inline Mini App script not found")
          Path("/tmp/supply-chain-mini-app.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/supply-chain-mini-app.js
